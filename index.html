<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/src/style.css" />

  <title>TechFlow</title>
  <script>
    const theme = localStorage.getItem("theme");
    const preferenceDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

    if (theme === "dark" || (!theme && preferenceDark)) {
      document.documentElement.classList.add("dark");
    } else {
      document.documentElement.classList.remove("dark")
    }
  </script>
</head>

<body class="select-none bg-zinc-200 text-slate-800 flex flex-col dark:bg-slate-800 dark:text-slate-100">
  <nav
    class="grid min-w-full grid-cols-[1fr_auto] gap-4 rounded-br-2xl border-b-2 border-zinc-400 bg-zinc-300 p-4 transition-all duration-300 ease-in-out dark:border-slate-900 dark:bg-slate-700 md:flex md:items-center md:gap-6">
    <div class="contents">
      <div class="flex min-w-0 items-center gap-3 md:shrink-0">
        <button id="sideBarOpen" type="button" aria-label="Abrir menu" aria-controls="sideBar" aria-expanded="false"
          class="rounded-lg p-2 text-slate-700 transition-colors hover:bg-zinc-400 dark:text-slate-200 dark:hover:bg-slate-600 md:hidden">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12" />
          </svg>
        </button>
        <img src="/src/assets/techflow-compact-color.svg" alt="Logo TechFlow" class="h-auto w-32 shrink-0 sm:w-40 dark:hidden">
        <img src="/src/assets/techflow-compact-white.svg" alt="Logo TechFlow" class="h-auto w-32 shrink-0 sm:w-40 hidden dark:block">
      </div>
    </div>
    <div class="flex shrink-0 items-center justify-self-end gap-2 md:order-2">
      <div
        class="flex items-center gap-1 rounded-3xl border border-gray-500 bg-gray-400 p-1 transition-all duration-300 ease-in-out dark:border-gray-600 dark:bg-gray-900 sm:gap-2 sm:p-2">
        <button id="btnLight" type="button" class="rounded-full p-2 transition-colors">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </button>
        <button id="btnDark" type="button" class="rounded-full p-2 transition-colors ">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z" />
          </svg>

        </button>
        <button id="btnSystem" type="button" class="rounded-full p-2 transition-colors">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="12" rx="2" />
            <path d="M8 20h8M12 16v4" />
          </svg>
        </button>
      </div>
      <button id="abrirModalNew" type="button" aria-label="Adicionar projeto"
        class="inline-flex items-center justify-center rounded-full font-medium bg-techflow-blueDark p-3 text-mist transition-colors hover:opacity-90 dark:bg-techflow-blueSky dark:text-night sm:rounded-3xl sm:px-3 sm:py-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="size-5 sm:size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        <span class="hidden sm:inline">Novo Projeto</span>
      </button>

    </div>
    <div
      class="relative col-span-2 flex min-w-0 w-full items-center rounded-xl border border-slate-500 bg-slate-800/5 px-3 py-2.5 text-slate-600 transition-all duration-300 ease-in-out dark:border-slate-600 dark:bg-slate-900/60 dark:text-slate-400 md:order-1 md:col-span-1 md:mx-0 md:mr-auto md:max-w-md md:flex-1">
      <svg class="size-5 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
        stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
      </svg>
      <input type="search" placeholder="Buscar projeto, responsável ou categoria"
        class="select-text min-w-0 w-full bg-transparent pl-2 text-sm outline-none">
    </div>
  </nav>
  <div id="sideBarOverlay" aria-hidden="true"
    class="pointer-events-none fixed inset-0 z-40 bg-black/50 opacity-0 transition-opacity duration-300 data-[open=true]:pointer-events-auto data-[open=true]:opacity-100 md:pointer-events-auto md:contents md:opacity-100">
    <aside id="sideBar" data-open="false"
      class="fixed inset-y-0 left-0 z-50 flex w-full max-w-70.5 -translate-x-full flex-col gap-5 overflow-y-auto rounded-br-2xl border-e-2 border-zinc-400 bg-zinc-300 px-10 py-6 transition-transform duration-300 ease-in-out data-[open=true]:translate-x-0 dark:border-slate-900 dark:bg-slate-700 md:static md:z-auto md:min-h-screen md:translate-x-0 md:overflow-visible">
      <button id="sideBarClose" type="button" aria-label="Fechar menu"
        class="self-end rounded-lg p-2 text-slate-700 transition-colors hover:bg-zinc-400 dark:text-slate-200 dark:hover:bg-slate-600 md:hidden">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
      <ul class="list-none flex flex-col gap-3 outline-none">
        <li>
          <a href="#" class="group flex gap-2 items-center rounded-lg bg-zinc-400/15 px-3 py-2.5 text-techflow-blue font-semibold transition active:scale-[0.98] dark:bg-techflow-blue/15 dark:text-slate-200 hover:text-slate-800 dark:hover:text-slate-200">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="size-6 group-hover:text-techflow-blue dark:group-hover:text-techflow-blueSky">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
            </svg>
            Dashboard</a>
        </li>
        <li>
          <a href="#" class="group flex items-center gap-2 rounded-lg px-3 py-2.5 transition text-gray-500/80 hover:bg-zinc-400/15 hover:text-slate-800 active:scale-[0.98] dark:hover:bg-techflow-blueDark/15 dark:hover:text-white">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="size-6 group-hover:text-techflow-blue dark:group-hover:text-techflow-blueSky">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" />
            </svg>
            Projetos
          </a>
        </li>
        <li>
          <a href="#" class="group flex items-center gap-2 rounded-lg px-3 py-2.5 transition text-gray-500/80 hover:bg-zinc-400/15 hover:text-slate-800 active:scale-[0.98] dark:hover:bg-techflow-blueDark/15 dark:hover:text-white">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="size-6 group-hover:text-techflow-blue dark:group-hover:text-techflow-blueSky">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M18 18.72a9.094 9.094 0 0 0 3.741-.479 3 3 0 0 0-4.682-2.72m.94 3.198.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0 1 12 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 0 1 6 18.719m12 0a5.971 5.971 0 0 0-.941-3.197m0 0A5.995 5.995 0 0 0 12 12.75a5.995 5.995 0 0 0-5.058 2.772m0 0a3 3 0 0 0-4.681 2.72 8.986 8.986 0 0 0 3.74.477m.94-3.197a5.971 5.971 0 0 0-.94 3.197M15 6.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm6 3a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Zm-13.5 0a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Z" />
            </svg>
            Equipe </a>
        </li>
        <li>
          <a href="#" class="group flex items-center gap-2 rounded-lg px-3 py-2.5 transition text-gray-500/80 hover:bg-zinc-400/15 hover:text-slate-800 active:scale-[0.98] dark:hover:bg-techflow-blueDark/15 dark:hover:text-white">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="size-6 group-hover:text-techflow-blue dark:group-hover:text-techflow-blueSky">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 7.5h1.5m-1.5 3h1.5m-7.5 3h7.5m-7.5 3h7.5m3-9h3.375c.621 0 1.125.504 1.125 1.125V18a2.25 2.25 0 0 1-2.25 2.25M16.5 7.5V18a2.25 2.25 0 0 0 2.25 2.25M16.5 7.5V4.875c0-.621-.504-1.125-1.125-1.125H4.125C3.504 3.75 3 4.254 3 4.875V18a2.25 2.25 0 0 0 2.25 2.25h13.5M6 7.5h3v3H6v-3Z" />
            </svg>
            Tarefas </a>
        </li>
        <li>
          <a href="#" class="group flex items-center gap-2 rounded-lg px-3 py-2.5 transition text-gray-500/80 hover:bg-zinc-400/15 hover:text-slate-800 active:scale-[0.98] dark:hover:bg-techflow-blueDark/15 dark:hover:text-white">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="size-6 group-hover:text-techflow-blue dark:group-hover:text-techflow-blueSky">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.25 18 9 11.25l4.306 4.306a11.95 11.95 0 0 1 5.814-5.518l2.74-1.22m0 0-5.94-2.281m5.94 2.28-2.28 5.941" />
            </svg>

            Relatórios </a>
        </li>
        <li>
          <a href="#" class="group flex items-center gap-2 rounded-lg px-3 py-2.5 transition text-gray-500/80 hover:bg-zinc-400/15 hover:text-slate-800 active:scale-[0.98] dark:hover:bg-techflow-blueDark/15 dark:hover:text-white">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="size-6 group-hover:text-techflow-blue dark:group-hover:text-techflow-blueSky">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M4.5 12a7.5 7.5 0 0 0 15 0m-15 0a7.5 7.5 0 1 1 15 0m-15 0H3m16.5 0H21m-1.5 0H12m-8.457 3.077 1.41-.513m14.095-5.13 1.41-.513M5.106 17.785l1.15-.964m11.49-9.642 1.149-.964M7.501 19.795l.75-1.3m7.5-12.99.75-1.3m-6.063 16.658.26-1.477m2.605-14.772.26-1.477m0 17.726-.26-1.477M10.698 4.614l-.26-1.477M16.5 19.794l-.75-1.299M7.5 4.205 12 12m6.894 5.785-1.149-.964M6.256 7.178l-1.15-.964m15.352 8.864-1.41-.513M4.954 9.435l-1.41-.514M12.002 12l-3.75 6.495" />
            </svg>
            Configurações
          </a>
        </li>
      </ul>
    </aside>
  </div>
  
  <div id="modal" data-open="false" aria-hidden="true"
    class="pointer-events-none fixed inset-0 z-60 flex items-center justify-center bg-black/50 p-4 opacity-0 transition-opacity duration-300 data-[open=true]:pointer-events-auto data-[open=true]:opacity-100">
    <div id="modalPainel" role="dialog" aria-modal="true" aria-labelledby="modalTitulo" tabindex="-1"
      class="w-full max-w-md scale-95 rounded-2xl border-2 border-zinc-400 bg-zinc-300 p-6 text-slate-800 shadow-xl transition-transform duration-300 dark:border-slate-900 dark:bg-slate-700 dark:text-slate-100 [#modal[data-open=true]_&]:scale-100">
      <div class="flex items-start justify-between py-4">
        <div class="flex flex-col ">
          <h2 id="modalTitulo" class="text-lg font-semibold">Novo Projeto</h2>
          <p class="text-gray-400 text-sm">Preencha os dados para adicionar ao painel</p>
        </div>
        <button type="button" data-close-modal aria-label="Fechar"
          class="rounded-lg p-2 transition-colors hover:bg-zinc-400 dark:hover:bg-slate-600">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <form class="flex flex-col gap-4">
        <label class="flex flex-col gap-1"><span class="text-base font-medium">Nome do projeto</span>
          <input type="text" required
            class="select-text rounded-xl border border-slate-500 bg-slate-800/5 px-3 py-2.5 outline-none dark:border-slate-600 dark:bg-slate-900/60">
        </label>
        <div class="grid grid-cols-2 gap-4">
            <label class="flex flex-col gap-2"><span class="font-medium text-base">Prazo</span>
              <input type="date" required class="select-text h-12 w-full rounded-2xl border border-slate-500 bg-slate-800/5 px-3 py-2.5 text-slate-600 transition-all duration-300 ease-in-out scheme-light dark:scheme-dark dark:border-slate-600 dark:bg-slate-900/60 dark:text-slate-400">
            </label>
            <label class="flex flex-col gap-2"><span class="font-medium text-base">Prioridade</span>
              <select name="" id="" required class="select-text h-12 w-full rounded-2xl border border-slate-500 bg-slate-800/5 px-3 py-2.5 text-slate-600 transition-all duration-300 ease-in-out dark:border-slate-600 dark:bg-slate-900/60 dark:text-slate-400">
                <option value="" >Selecione</option>
                <option value="baixo">Baixa</option>
                <option value="media">Media</option>
                <option value="alta">Alta</option>
              </select>
            </label>
            <label class="flex flex-col gap-2"><span class="font-medium text-base">Responsável</span>
              <input type="text" placeholder="Nome e Sobrenome" required class="select-text h-12 w-full rounded-2xl border border-slate-500 bg-slate-800/5 px-3 py-2.5 text-slate-600 transition-all duration-300 ease-in-out dark:border-slate-600 dark:bg-slate-900/60 dark:text-slate-400">
            </label>
            <label class="flex flex-col gap-2"><span class="font-medium text-base">Categoria</span>
              <select name="" id=""  required class="select-text h-12 w-full rounded-2xl border border-slate-500 bg-slate-800/5 px-3 py-2.5 text-slate-600 transition-all duration-300 ease-in-out dark:border-slate-600 dark:bg-slate-900/60 dark:text-slate-400">
                <option value="" >Selecione</option>
                <option value="dev">Desenvolvimento</option>
                <option value="design">Design</option>
                <option value="marketing">Marketing</option>
                <option value="infra">Infraestrutura</option>
                <option value="dados">Dados</option>
              </select>
            </label>
        </div>
        <label class="flex flex-col gap-2 text-sm font-medium"><span class="text-base font-medium">Descrição</span>
          <textarea rows="3" required
            class="select-text rounded-xl border border-slate-500 bg-slate-800/5 px-3 py-2.5 outline-none dark:border-slate-600 dark:bg-slate-900/60"></textarea>
        </label>
        <div class="flex justify-end gap-2">
          <button type="button" data-close-modal
            class="rounded-3xl px-4 py-2 transition-colors hover:bg-zinc-400 dark:hover:bg-slate-600">Cancelar</button>
          <button type="submit"
            class="rounded-3xl bg-techflow-blueDark px-4 py-2 text-mist transition-colors hover:opacity-90 dark:bg-techflow-blueSky dark:text-night">Criar</button>
        </div>
      </form>
    </div>
  </div>
  <script src="/src/js/app.js"></script>
</body>

</html>
