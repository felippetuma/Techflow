<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/src/style.css" />

  <title>TechFlow</title>
  <script>
    const theme = localStorage.getItem("theme");
    const preferenceDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    
    if (theme === "dark" || (!theme && preferenceDark)) {
      document.documentElement.classList.add("dark");
    } else {
      document.documentElement.classList.remove("dark")
    }
  </script>
</head>

<body class="select-none bg-zinc-200 text-slate-800 flex flex-col dark:bg-slate-800 dark:text-slate-100">
  <nav
    class="flex min-w-full flex-col items-stretch justify-between gap-4 rounded-b-2xl bg-zinc-300 p-4 transition-all duration-300 ease-in-out dark:bg-slate-700 sm:gap-4 md:flex-row md:items-center md:gap-10">
    <div class="flex w-full flex-col items-stretch gap-4 sm:flex-row sm:items-center sm:gap-6">
      <img src="/src/assets/techflow-compact-color.svg" alt="logo TechFlow"
        class="h-auto w-32 shrink-0 self-center sm:w-36 md:w-40 md:self-auto">
      <div
        class="relative flex min-w-0 w-full items-center rounded-2xl bg-gray-400 border border-gray-500 px-4 py-3 text-center text-white transition-all duration-300 ease-in-out dark:border-gray-600 dark:bg-gray-900 sm:max-w-xl">
        <!-- <svg class="pointer-events-none absolute left-3 top-1/2 size-5 -translate-y-1/2 text-ink-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg> -->
        <svg class="size-5 absolute" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>
        <input type="search" placeholder="Buscar projeto, responsável ou categoria"
          class="select-text min-w-0 w-full bg-transparent pl-7 outline-none">
      </div>
    </div>
    <div
      class="flex shrink-0 self-center items-center gap-4 rounded-3xl border border-gray-500 bg-gray-400 p-2 transition-all duration-300 ease-in-out dark:border-gray-600 dark:bg-gray-900 md:self-auto">
      <button id="btnLight" type="button" class="rounded-full p-2 transition-colors">
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
      <button id="btnDark" type="button" class="rounded-full p-2 transition-colors ">
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z" />
        </svg>

      </button>
      <button id="btnSystem" type="button" class="rounded-full p-2 transition-colors">
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="12" rx="2" />
          <path d="M8 20h8M12 16v4" />
        </svg>
      </button>
    </div>
    <div
      class="inline-flex shrink-0 items-center justify-center rounded-3xl bg-techflow-blueDark dark:bg-techflow-blueSky dark:text-night px-3 py-2 text-mist text-base text-center whitespace-nowrap">
      <button type="button" class="whitespace-nowrap text-center">Adicionar Projeto</button>
    </div>
  </nav>
  <script src="/src/js/app.js"></script>
</body>

</html>
